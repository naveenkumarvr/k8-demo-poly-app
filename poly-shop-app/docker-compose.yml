# Poly-Shop Suite - Master Docker Compose Orchestration
# Orchestrates Cart-Service + Product-Service + Shared Infrastructure
#
# Services:
# - cart-service (port 8080) + Redis
# - product-service (port 8090) + PostgreSQL  
# - Jaeger (all-in-one) for distributed tracing
#
# Network: poly-shop-net (custom bridge)

services:
  # ============================================================================
  # INFRASTRUCTURE - Databases & Cache
  # ============================================================================

  # Redis for Cart-Service
  redis:
    image: redis:7-alpine
    container_name: poly-shop-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - poly-shop-net
    restart: unless-stopped

  # PostgreSQL for Product-Service
  postgres:
    image: postgres:16-alpine
    container_name: poly-shop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-products}
      POSTGRES_USER: ${POSTGRES_USER:-productuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-productpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./product-service/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./product-service/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U productuser -d products" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - poly-shop-net
    restart: unless-stopped

  # ============================================================================
  # OBSERVABILITY - Distributed Tracing
  # ============================================================================

  # Jaeger All-in-One (Collector + Query + UI)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: poly-shop-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "14268:14268" # Jaeger collector HTTP
      - "9411:9411" # Zipkin compatible endpoint
    networks:
      - poly-shop-net
    restart: unless-stopped

  # ============================================================================
  # MICROSERVICES - Application Layer
  # ============================================================================

  # Product Service - Product Catalog Management
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: poly-shop-product-service
    ports:
      - "8090:8090"
    environment:
      - SERVICE_NAME=product-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=production
      - PORT=8090
      - DATABASE_URL=${PRODUCT_SERVICE_DATABASE_URL:-postgres://productuser:productpass@postgres:5432/products?sslmode=disable}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}
      - POD_NAME=poly-shop-product
      - NODE_NAME=docker-compose
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8090/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - poly-shop-net
    restart: unless-stopped

  # Cart Service - Shopping Cart Management
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: poly-shop-cart-service
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=cart-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=production
      - PORT=8080
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}
      - POD_NAME=poly-shop-cart
      - NODE_NAME=docker-compose
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - poly-shop-net
    restart: unless-stopped

  # Checkout Service - Payment Processing & Currency Conversion
  checkout-service:
    build:
      context: ./checkout-service
      dockerfile: Dockerfile
    container_name: poly-shop-checkout-service
    ports:
      - "8085:8085"
    environment:
      - SERVICE_NAME=checkout-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=production
      - SPRING_PROFILES_ACTIVE=prod
      - CART_SERVICE_URL=${CART_SERVICE_URL:-http://cart-service:8080}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT_JAVA:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
      - OTEL_SERVICE_NAME=checkout-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=poly-shop,service.version=1.0.0
      - STARTUP_DELAY_SECONDS=${STARTUP_DELAY_SECONDS:-15}
      - DB_URL=${DB_URL:-jdbc:h2:mem:checkoutdb}
      - DB_DRIVER=${DB_DRIVER:-org.h2.Driver}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_DDL_AUTO=${DB_DDL_AUTO:-create-drop}
      - H2_CONSOLE_ENABLED=${H2_CONSOLE_ENABLED:-true}
      - JAVA_OPTS=-Xms512m -Xmx768m
    depends_on:
      jaeger:
        condition: service_started
      cart-service:
        condition: service_started # Changed from service_healthy to bypass health check issues
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - poly-shop-net
    restart: unless-stopped
  # Shop UI - Frontend Application
  shop-ui:
    build:
      context: ./shop-ui
      dockerfile: Dockerfile
      args:
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_HTTP:-http://localhost:4318/v1/traces}
    container_name: poly-shop-ui
    ports:
      - "8070:8080"
    environment:
      - NODE_ENV=production
    depends_on:
      - product-service
      - cart-service
      - checkout-service
    networks:
      - poly-shop-net
    restart: unless-stopped

  # Notification Worker - Async event-driven background processor
  # Subscribes to Redis Pub/Sub cart-events and processes them (e.g., notifications, analytics)
  notification-worker:
    build:
      context: ./notification-worker
      dockerfile: Dockerfile
    container_name: poly-shop-notification-worker
    environment:
      - SERVICE_NAME=notification-worker
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=production
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - EVENT_CHANNEL=cart-events
      - POD_NAME=poly-shop-notification-worker
      - NODE_NAME=docker-compose
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - poly-shop-net
    restart: unless-stopped

  # ============================================================================
  # VOLUMES - Persistent Data Storage
  # ============================================================================

volumes:
  # Redis persistence for cart data
  redis-data:
    driver: local
    name: poly-shop-redis-data

  # PostgreSQL persistence for product catalog
  postgres-data:
    driver: local
    name: poly-shop-postgres-data
  # ============================================================================
  # NETWORKS - Service Communication
  # ============================================================================

networks:
  poly-shop-net:
    driver: bridge
    name: poly-shop-net
    ipam:
      config:
        - subnet: 172.25.0.0/16
