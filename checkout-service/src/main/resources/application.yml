# Poly-Shop Checkout Service - Spring Boot Configuration
# Configured for Kubernetes readiness with health probes and distributed tracing

server:
  port: 8085
  shutdown: graceful # Graceful shutdown for K8s termination

spring:
  application:
    name: checkout-service
  
  # H2 In-Memory Database Configuration (local/demo only)
  # For production, replace with a real database (PostgreSQL) and mount credentials via env/secret
  datasource:
    url: ${DB_URL:jdbc:h2:mem:checkoutdb}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console (for debugging only, disabled in production via profile)
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

# Spring Boot Actuator - Kubernetes Health Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true # Enable liveness & readiness probes
  
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging Configuration
# Structured JSON logging is configured in logback-spring.xml (stdout only, 12-Factor App)
logging:
  level:
    root: INFO
    com.polyshop.checkout: DEBUG
    org.springframework.web: INFO

# Application Configuration
checkout:
  # Cart Service URL (Docker Compose / K8s service name)
  cart-service-url: ${CART_SERVICE_URL:http://cart-service:8080}
  
  # Payment Processing Simulation
  payment:
    success-rate: 0.8 # 80% success rate
    processing-time-ms: 200 # Simulated processing delay
  
  # Startup Delay for Testing K8s startupProbe
  startup-delay-seconds: ${STARTUP_DELAY_SECONDS:15}

# Currency Conversion Rates (Mock Data)
currency:
  rates:
    USD_TO_CAD: 1.35
    USD_TO_EUR: 0.92
    USD_TO_GBP: 0.79
    CAD_TO_USD: 0.74
    EUR_TO_USD: 1.09
    GBP_TO_USD: 1.27

---
# Production profile: disable H2 console
spring:
  config:
    activate:
      on-profile: prod
  h2:
    console:
      enabled: false
